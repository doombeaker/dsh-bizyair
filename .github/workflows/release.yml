name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm CLI that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
          node --version

      - name: Verify bundle syntax
        run: npm run check

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "version $VERSION already published; skipping"
          else
            npm publish --access public --provenance
          fi

      - name: Build plugin-market index
        run: |
          mkdir -p site
          node scripts/build-index.mjs --source npm --out site/index.json \
            --author doombeaker \
            --repository https://github.com/doombeaker/dsh-bizyair \
            --homepage https://github.com/doombeaker/dsh-bizyair
          cp icon.svg site/icon.svg
          cat site/index.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
